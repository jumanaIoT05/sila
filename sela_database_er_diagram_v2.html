<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
#erd { padding: 1rem 0; overflow-x: auto; }
</style>
<h2 class="sr-only">Updated entity relationship diagram for the Sela personal finance database, now including a goal calculation mode lookup table linked to financial goals.</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USER ||--o{ ACCOUNT : owns
  USER ||--o{ TRANSACTION : has
  USER ||--o{ AI_OUTPUT : receives
  USER ||--o{ FINANCIAL_SCORE_SNAPSHOT : has
  USER ||--o{ HEALTH_SCORE_SNAPSHOT : has
  USER ||--o{ SMART_BUDGET : sets
  USER ||--o{ FINANCIAL_GOAL : defines
  BANK ||--o{ ACCOUNT : categorizes
  ACCOUNT ||--o{ TRANSACTION : records
  TRANSACTION_TYPE ||--o{ TRANSACTION : classifies
  SPENDING_CATEGORY ||--o{ TRANSACTION : tags
  SPENDING_CATEGORY ||--o{ SMART_BUDGET : limits
  AI_OUTPUT_TYPE ||--o{ AI_OUTPUT : labels
  HEALTH_STATUS ||--o{ HEALTH_SCORE_SNAPSHOT : rates
  GOAL_CALCULATION_MODE ||--o{ FINANCIAL_GOAL : determines

  USER {
    int user_id PK
    string phone_number
    datetime created_at
  }
  BANK {
    int bank_id PK
    string bank_name
  }
  ACCOUNT {
    int account_id PK
    int user_id FK
    int bank_id FK
    string last_four_digits
    decimal current_balance
    boolean is_manually_added
  }
  TRANSACTION {
    int transaction_id PK
    int user_id FK
    int account_id FK
    int transaction_type_id FK
    int spending_category_id FK
    decimal amount
    datetime transaction_date
  }
  TRANSACTION_TYPE {
    int transaction_type_id PK
    string type_name
  }
  SPENDING_CATEGORY {
    int spending_category_id PK
    string category_name
  }
  AI_OUTPUT {
    int ai_output_id PK
    int user_id FK
    int ai_output_type_id FK
    text content
    datetime generated_at
  }
  AI_OUTPUT_TYPE {
    int ai_output_type_id PK
    string output_type_name
  }
  FINANCIAL_SCORE_SNAPSHOT {
    int financial_score_id PK
    int user_id FK
    int score_value
    datetime snapshot_date
  }
  HEALTH_SCORE_SNAPSHOT {
    int health_score_id PK
    int user_id FK
    int health_status_id FK
    datetime snapshot_date
  }
  HEALTH_STATUS {
    int health_status_id PK
    string status_name
  }
  SMART_BUDGET {
    int budget_id PK
    int user_id FK
    int spending_category_id FK
    decimal recommended_amount
  }
  FINANCIAL_GOAL {
    int goal_id PK
    int user_id FK
    int calculation_mode_id FK
    string goal_type
    decimal target_amount
    decimal monthly_saving_amount
    int estimated_months
  }
  GOAL_CALCULATION_MODE {
    int calculation_mode_id PK
    string mode_name
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
